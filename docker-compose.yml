services:
  db:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: devops_tasks
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysql_data: